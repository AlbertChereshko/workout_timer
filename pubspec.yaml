name: workout_timer
description: EMOM + Tabata workout timer app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local database (Hive - no codegen conflicts)
  hive_flutter: ^1.1.0

  # Audio & haptics
  audioplayers: ^6.1.0
  vibration: ^2.0.0

  # Keep screen on
  wakelock_plus: ^1.2.8

  # Text-to-speech
  flutter_tts: ^4.1.0

  # Settings storage
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0

  # Firebase & Google Authentication
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2

  # Custom sound file picking
  file_picker: ^8.1.4

  # Fonts & Typography
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  cloud_firestore: ^5.6.12
  home_widget: ^0.9.2+1
  flutter_staggered_grid_view: ^0.7.0
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.7.7+1
  flutter_local_notifications: ^20.1.0
  share_plus: ^12.0.2
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/google_fonts/
